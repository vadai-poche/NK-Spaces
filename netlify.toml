[build]
  # The IPO tracker is served from its own site at ipo.nkspaces.in (base=trading),
  # so the marketing site only builds the Astro output.
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the optimized project images (their content never changes once built)
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

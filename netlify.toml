[build]
  # Build the Astro site, then drop the self-contained IPO tracker page into the
  # published folder so it is served at nkspaces.in/trading/ (it lives at the repo
  # root, outside Astro's build, so Netlify wouldn't include it otherwise).
  command = "npm run build && mkdir -p dist/trading && cp trading/index.html dist/trading/"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache the optimized project images (their content never changes once built)
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

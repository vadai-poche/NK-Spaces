name: Daily IPO Update

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST
    - cron: '30 10 * * *'  # 4:00 PM IST
  workflow_dispatch:

# Allow the workflow's GITHUB_TOKEN to push the generated files back to the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: trading/requirements.txt

      - name: Install dependencies
        run: pip install -r trading/requirements.txt

      - name: Run IPO update
        run: python trading/generate_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading/ipo_master.csv trading/ipo_updates.csv trading/index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: daily IPO update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
